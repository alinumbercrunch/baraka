<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展示室 — Baraka</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%}
body{display:flex; flex-direction:column}
.cap{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; width:100%; padding-block:10px}
.cap .by{margin-left:auto; display:flex; gap:16px; font-size:12.5px}
.cap .by a{color:var(--mute); text-decoration:none; border-bottom:1px solid var(--rule)}
.cap h1{font-family:var(--min); font-weight:600; font-size:clamp(17px,2.2vw,21px)}
#stage{flex:1 1 0; min-height:0; position:relative; overflow:clip; background:var(--paper)}

/* ── the room: every length is millimetres × --u, so one number sets the true scale ── */
#room{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d}
.rm{position:absolute; transform-style:preserve-3d; transform:translateX(calc(var(--x) * var(--u)))}
.wall{position:absolute; left:calc(var(--len) * var(--u) / -2); top:calc(var(--high) * var(--u) / -2);
  width:calc(var(--len) * var(--u)); height:calc(var(--high) * var(--u)); backface-visibility:hidden}
/* tone is what makes the depth read: each surface a step down, darkening toward you */
.wall.back{background:#f4f4f4; transform:translateZ(calc(var(--deep) * var(--u) / -2))}
.wall.left{background:linear-gradient(90deg,#d9d9d9,#ececec 70%); transform:rotateY(90deg) translateZ(calc(var(--wide) * var(--u) / -2))}
.wall.right{background:linear-gradient(90deg,#ececec 30%,#d9d9d9); transform:rotateY(-90deg) translateZ(calc(var(--wide) * var(--u) / -2))}
.wall.floor{top:calc(var(--deep) * var(--u) / -2); height:calc(var(--deep) * var(--u));
  background:linear-gradient(#e2e2e2,#c9c9c9); transform:rotateX(90deg) translateZ(calc(var(--high) * var(--u) / -2))}
.hung{position:absolute; left:calc(var(--l) * var(--u)); top:calc(var(--t) * var(--u));
  width:calc(var(--w) * var(--u)); height:calc(var(--h) * var(--u));
  box-shadow:0 2px 7px rgba(0,0,0,.28)}
.hung img{display:block; width:100%; height:100%}
.hung:hover{outline:1px solid var(--ink); outline-offset:3px}
/* gallery convention: a red dot beside a sold work */
.hung.sold::after{content:""; position:absolute; right:-14px; bottom:0; width:8px; height:8px;
  border-radius:50%; background:var(--shu)}

/* ── the panel: the work stays visible, whole, beside it ── */
#panel{position:fixed; inset:0 0 0 auto; margin:0; width:340px; max-width:100%; height:100%; max-height:100%;
  border:0; border-left:1px solid var(--rule); padding:0; background:var(--paper); color:var(--ink)}
#panel::backdrop{background:none}
.in{padding:22px 24px; min-height:100%; display:flex; flex-direction:column; gap:4px}
#pi{display:none}
#pt{font-family:var(--min); font-weight:600; font-size:24px; margin-top:6px}
#pp{font-family:var(--mono); font-size:18px; margin:8px 0 0}
.facts{margin:10px 0 0; border-top:1px solid var(--ink)}
.facts div{display:flex; gap:12px; border-bottom:1px solid var(--rule); padding:7px 0; font-size:13px}
.facts dt{flex:0 0 58px; font-size:12px; color:var(--mute)}
.facts dd{margin:0}
.go{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.go .door{text-align:center; background:none; color:var(--ink); font-size:13.5px; padding:10px 14px}
.go .door:hover{background:var(--ink); color:var(--sheet)}
.go .door[aria-pressed="true"]{background:var(--ink); color:var(--sheet)}
.turn{display:flex; justify-content:space-between; gap:8px; margin-top:auto; padding-top:16px}
.turn button,.x{background:none; border:0; border-bottom:1px solid var(--rule); color:var(--mute); font-size:12.5px; padding:2px 0}
.x{align-self:flex-end}
.sum{color:var(--shu); font-size:13px; margin:12px 0 0}

/* ── phones: no room fits a portrait screen, so one long wall to swipe along ── */
@media (max-width:760px){
  #stage{overflow-x:auto; scroll-snap-type:x proximity}
  #room{position:relative; left:0; top:0; height:100%}
  .rm{position:relative; width:calc(var(--wide) * var(--u)); height:100%; transform:none}
  .wall.back{transform:none; left:0; top:0}
  .hung{scroll-snap-align:center}
  #panel{inset:auto 0 0 0; width:100%; height:auto; max-height:88svh; border-left:0; border-top:1px solid var(--rule)}
  #pi{display:block; width:auto; max-width:100%; max-height:32svh; margin:0 auto 8px}
}
</style>
</head>
<body>
<div class="protobar">これは<b>プロトタイプ</b>です。作家名・作品名・価格はすべて架空のサンプルです。画像はパブリックドメインの美術館所蔵作品を仮に使用しています。<span class="pe">This is a prototype. Artists, titles and prices are fictional samples.</span></div>
<div class="wrap" style="width:100%">
  <nav class="bar">
    <a class="mark" href="index.html">BARAKA<small>バラカ</small></a>
    <a href="index.html">ホーム</a>
    <a href="works.html">すべての作品</a>
    <a href="artists.html">作家一覧</a>
    <a href="trade.html">法人の方へ</a>
    <a href="enquiry.html"><b>お問い合わせ</b></a>
  </nav>
  <header class="cap">
    <h1 id="ttl">展示室</h1>
    <span class="en">作品を押すと、正面から見られます。大きさの比率は実物どおりです。</span>
    <span class="by"><a id="toPrev" href="index.html"></a><a id="toNext" href="index.html"></a></span>
  </header>
</div>
<main id="stage"><div id="room"></div></main>

<dialog id="panel" aria-labelledby="pt"><div class="in">
  <button type="button" class="x" id="px">閉じる ×</button>
  <img id="pi" alt="">
  <h2 id="pt"></h2>
  <a id="pa" href="index.html"></a>
  <p id="pp"></p>
  <dl class="facts" id="pf"></dl>
  <p class="sum" id="ps" hidden>完売しました</p>
  <div class="go">
    <button type="button" class="door" id="padd" aria-pressed="false">+ リストに入れる</button>
    <a class="door" id="pe" href="enquiry.html">2週間お取り置き・問い合わせ</a>
    <a class="door ghost" id="pg" href="works.html">くわしく見る</a>
  </div>
  <div class="turn" id="pn"><button type="button" id="pprev">← 前の作品</button><button type="button" id="pnext">次の作品 →</button></div>
</div></dialog>

<script src="works.js"></script>
<script src="room.js"></script>
<script>
const $=id=>document.getElementById(id), stage=$("stage"), rm=$("room"), panel=$("panel");
const phone=matchMedia("(max-width:760px)"), still=matchMedia("(prefers-reduced-motion:reduce)");
const WALK="transform .4s ease", ENTER="transform .9s ease", LOOK="transform .9s cubic-bezier(.2,1,.3,1)", SWAY="transform .2s ease-out";
let built="", plot=null, now=null, busy=false, seen=null;   // on the walls, the route, mid-walk, last work viewed

const size=()=>({w:stage.clientWidth,h:stage.clientHeight});
const flat=()=>phone.matches;
const motion=()=>!flat()&&!still.matches;
function roomHTML(r,pl,x){
  const wall=(id,len,inner)=>'<div class="wall '+id+'" style="--len:'+len+'">'+inner+'</div>';
  const hungOn=id=>pl.spots.filter(s=>s.wall===id).map(({k,x,y})=>
    '<a class="hung'+(k.sold?' sold':'')+'" id="h'+k.no+'" href="#'+r.artist+'/'+k.no+'" style="--l:'+(x-k.w/2)+';--t:'+(pl.h-y-k.h/2)+';--w:'+k.w+';--h:'+k.h+'">'+
    '<img src="'+k.f+'" width="'+k.w+'" height="'+k.h+'" alt="'+k.t+'（'+k.a+'）'+(k.sold?' 完売':'')+'" decoding="async"></a>').join("");
  return '<div class="rm" style="--x:'+x+';--wide:'+pl.w+';--deep:'+pl.d+';--high:'+pl.h+'">'+
    wall("back",pl.w,hungOn("back"))+(flat()?"":
    wall("left",pl.d,hungOn("left"))+wall("right",pl.d,hungOn("right"))+wall("floor",pl.w,""))+'</div>';
}
function label(r){
  $("ttl").textContent=r.works[0].a+"の展示室";
  document.title=r.works[0].a+"の展示室 — Baraka";
  for(const [id,by,txt] of [["toPrev",-1,"← "],["toNext",1,""]]){
    const a=neighbour(r.artist,by), n=WORKS.find(k=>artistKey(k)===a).a;
    $(id).href="#"+a; $(id).textContent=by<0?txt+n:n+" →";
  }
}
function build(r){
  plot=plan(r.works,flat());
  built=r.artist+flat();
  rm.innerHTML=roomHTML(r,plot,0);
  label(r);
}
const go=(t,how)=>new Promise(done=>{
  rm.style.transition=how; rm.style.transform=t;
  setTimeout(done,parseFloat(how.split(" ")[1])*1000);
});
/* the demo's move: back out of the doorway, along to the next door, and in */
async function walk(r,by){
  busy=true;
  const s=size(), next=plan(r.works,false), along=-by*plot.w;
  await go(rest(plot,s,{in:false}),WALK);
  rm.insertAdjacentHTML("beforeend",roomHTML(r,next,-along));
  await go(rest(plot,s,{in:false,x:along}),WALK);
  await go(rest(next,s,{x:along}),WALK);
  rm.style.transition="none";
  rm.firstElementChild.remove();
  rm.firstElementChild.style.setProperty("--x",0);
  plot=next; built=r.artist+false;
  label(r);
  busy=false;
  sync();
}
function fill(k,r){
  seen=k;
  $("pi").src=k.f; $("pi").alt=k.t;
  $("pt").textContent=k.t;
  $("pa").textContent=k.a; $("pa").href=k.ap;
  $("pp").textContent=yen(k.price);
  $("pf").innerHTML=[["寸法","H"+mm(k.h)+" × W"+mm(k.w)+" × D"+k.d+" mm"],["技法",k.med],["重量",k.kg.toFixed(1)+" kg"],["取付",k.fix],["作品番号",k.no]]
    .map(([a,b])=>'<div><dt>'+a+'</dt><dd>'+b+'</dd></div>').join("");
  $("ps").hidden=!k.sold; $("padd").hidden=$("pe").hidden=!!k.sold;
  $("pe").href="enquiry.html#"+page(k).replace(".html","");
  $("pg").href=page(k);
  $("pn").hidden=r.works.length<2;
  mark(k);
}
function mark(k){
  const on=!!loadPicks()[k.no];
  $("padd").setAttribute("aria-pressed",on);
  $("padd").textContent=on?"リストに追加済み":"+ リストに入れる";
}
function aim(how){
  const s=size(), spot=now.work&&plot.spots.find(p=>p.k===now.work), {u,p}=lens(plot,s);
  rm.style.setProperty("--u",(flat()?s.h/plot.h:u)+"px");
  if(flat()){ rm.style.transform="none"; return }
  stage.style.perspective=p+"px";
  rm.style.transition=still.matches?"none":how||LOOK;
  rm.style.transform=spot
    ? face(plot,spot,s,{x:0,y:0,w:(panel.open?panel.getBoundingClientRect().left:innerWidth)-stage.getBoundingClientRect().left,h:s.h}).t
    : rest(plot,s);
}
function sync(){
  if(busy) return;
  const was=now; now=route(location.hash);
  const moved=was&&was.artist!==now.artist;
  if(moved&&!now.work&&!panel.open&&motion())
    return walk(now,neighbour(was.artist,1)===now.artist?1:-1);
  if(built!==now.artist+flat()) build(now);
  if(now.work){ fill(now.work,now); if(!panel.open) panel.showModal() }
  else if(panel.open) panel.close();
  if(!was&&!now.work&&motion()){    // arriving: start at the door and walk in
    aim("none");
    rm.style.transform=rest(plot,size(),{in:false});
    rm.getBoundingClientRect();
    go(rest(plot,size()),ENTER);
  } else aim();
}
function shut(){ location.hash=now.artist }
function step(by){
  const i=now.works.indexOf(now.work), n=now.works.length;
  location.hash=now.artist+"/"+now.works[(i+by+n)%n].no;
}
panel.addEventListener("close",()=>{
  const was=route(location.hash).work||seen;   // the hash leads now.work by a tick
  if(route(location.hash).work) shut();
  if(was) $("h"+was.no)?.focus({preventScroll:!flat()});   // gone if Back left the room
});
panel.addEventListener("click",e=>{ if(e.target===panel) panel.close() });   // the room beside the panel
panel.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1);
});
$("px").onclick=()=>panel.close();
$("pprev").onclick=()=>step(-1);
$("pnext").onclick=()=>step(1);
$("padd").onclick=()=>{ saveStore({p:togglePick(loadPicks(),now.work)}); mark(now.work) };
addEventListener("hashchange",sync);
phone.addEventListener("change",sync);
new ResizeObserver(()=>now&&!busy&&aim("none")).observe(stage);
addEventListener("mousemove",e=>{
  if(busy||now.work||!motion()) return;
  const s=size();
  requestAnimationFrame(()=>go(rest(plot,s,tilt(e.clientX,e.clientY,s)),SWAY));
});
sync();
</script>
</body>
</html>
